    <main class="wrap" id="page"></main>

    <script>
      (function () {
        "use strict";

        /**
         * Prefer page config from the URL hash (Firefox chat puts validated
         * JSON there via encodeURIComponent). Fall back to the embedded
         * #page-config demo block when no hash is present.
         */
        function loadPageConfig() {
          var hash = (location.hash || "").replace(/^#/, "");
          if (hash) {
            try {
              return JSON.parse(decodeURIComponent(hash));
            } catch (e) {
              // Some hosts or copy/paste paths may leave the hash unescaped.
              try {
                return JSON.parse(hash);
              } catch (e2) {
                throw new Error(
                  "Could not parse AITab JSON from the URL hash."
                );
              }
            }
          }
          var el = document.getElementById("page-config");
          if (!el) {
            throw new Error("No page config found.");
          }
          return JSON.parse(el.textContent);
        }

        var root = document.getElementById("page");
        var PAGE;
        try {
          PAGE = loadPageConfig();
        } catch (err) {
          root.innerHTML =
            '<p style="padding:2rem;font:message-box;color:#5b5b66">' +
            String(err.message || err) +
            "</p>";
          return;
        }

        if (PAGE.header && PAGE.header.title) {
          document.title = PAGE.header.title;
        }

        // theme comes from the page config; light/dark follows the OS
        document.documentElement.setAttribute(
          "data-theme",
          PAGE.theme || "firefox"
        );
        document.documentElement.setAttribute(
          "data-mode",
          window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        );

        /* ---- shared helpers ---------------------------------------------------- */
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function byRole(schema, role) {
          return schema.fields.filter(function (f) {
            return (f.role || "detail") === role;
          });
        }
        function firstByRole(schema, role) {
          return byRole(schema, role)[0] || null;
        }
        function has(row, f) {
          if (!f) return false;
          var v = row[f.key];
          if (v === undefined || v === null || v === "") return false;
          if (Array.isArray(v) && !v.length) return false;
          return true;
        }
        function formatValue(field, value) {
          var pre = field.prefix || "",
            suf = field.suffix || "";
          switch (field.type) {
            case "currency":
              return (
                pre +
                Number(value).toLocaleString(undefined, {
                  style: "currency",
                  currency: field.currency || "USD",
                  maximumFractionDigits: 0,
                }) +
                suf
              );
            case "number":
              return pre + Number(value).toLocaleString() + suf;
            case "date":
              var d = new Date(value);
              return isNaN(d)
                ? esc(value)
                : d.toLocaleDateString(undefined, {
                    weekday: "short",
                    month: "short",
                    day: "numeric",
                  });
            case "boolean":
              return value
                ? '<span class="bool yes">✓ Yes</span>'
                : '<span class="bool no">✕ No</span>';
            case "rating":
              var max = field.max || 5,
                full = Math.round(Number(value)),
                s = "";
              for (var i = 0; i < max; i++) s += i < full ? "★" : "☆";
              return (
                '<span class="stars">' +
                s +
                '<span class="num">' +
                esc(value) +
                "/" +
                max +
                "</span></span>"
              );
            case "tags":
              return (
                '<span class="chips">' +
                (value || [])
                  .map(function (t) {
                    return '<span class="chip">' + esc(t) + "</span>";
                  })
                  .join("") +
                "</span>"
              );
            default:
              return pre + esc(value) + suf;
          }
        }
        function thumb(schema, row) {
          var f = firstByRole(schema, "image");
          return has(row, f)
            ? '<img class="thumb" loading="lazy" alt="" src="' +
                esc(row[f.key]) +
                '" onerror="this.style.visibility=\'hidden\'" />'
            : "";
        }
        function badge(schema, row) {
          var f = firstByRole(schema, "badge");
          return has(row, f)
            ? '<span class="badge">' + esc(row[f.key]) + "</span>"
            : "";
        }
        function action(schema, row) {
          var f = firstByRole(schema, "action");
          return has(row, f)
            ? '<a class="btn secondary" target="_blank" rel="noopener" href="' +
                esc(row[f.key]) +
                '">' +
                esc(f.label || "Open") +
                " ↗</a>"
            : "";
        }

        /* ---- list superpowers: aggregates, best-value, JSON-LD ----------------- */
        var NUMERIC = { number: 1, currency: 1, rating: 1 };
        var currentBest = null;
        function bestClass(row) {
          return row === currentBest ? " is-best" : "";
        }
        function ribbon(row) {
          return row === currentBest
            ? '<span class="ribbon">★ Best value</span>'
            : "";
        }
        function formatNum(field, value) {
          var n = Number(value);
          if (field.type === "currency")
            return n.toLocaleString(undefined, {
              style: "currency",
              currency: field.currency || "USD",
              maximumFractionDigits: 0,
            });
          if (field.type === "rating") return n.toFixed(1);
          var r = Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 10) / 10;
          return r.toLocaleString() + (field.suffix || "");
        }
        function aggregate(field, rows) {
          var vals = [];
          rows.forEach(function (r) {
            var v = Number(r[field.key]);
            if (!isNaN(v)) vals.push(v);
          });
          if (!vals.length) return null;
          var sum = vals.reduce(function (a, b) {
            return a + b;
          }, 0);
          return {
            min: Math.min.apply(null, vals),
            max: Math.max.apply(null, vals),
            avg: sum / vals.length,
          };
        }
        function computeBest(schema, rows) {
          var usable = schema.fields
            .filter(function (f) {
              return f.goal && NUMERIC[f.type];
            })
            .map(function (f) {
              var a = aggregate(f, rows);
              return a && a.max !== a.min ? { f: f, a: a } : null;
            })
            .filter(Boolean);
          if (usable.length < 2 || rows.length < 2) return null;
          var best = null,
            top = -1;
          rows.forEach(function (row) {
            var s = 0,
              n = 0;
            usable.forEach(function (u) {
              var v = Number(row[u.f.key]);
              if (isNaN(v)) return;
              var norm = (v - u.a.min) / (u.a.max - u.a.min);
              if (u.f.goal === "min") norm = 1 - norm;
              s += norm;
              n++;
            });
            if (n) {
              var sc = s / n;
              if (sc > top) {
                top = sc;
                best = row;
              }
            }
          });
          return best;
        }
        function summaryHtml(schema, rows) {
          var numFields = schema.fields.filter(function (f) {
            return NUMERIC[f.type];
          });
          if (!numFields.length || !rows.length) return "";
          var nameF = firstByRole(schema, "title") || schema.fields[0];
          var tiles =
            '<div class="stat"><div class="s-val">' +
            rows.length +
            '</div><div class="s-lab">' +
            (rows.length === 1 ? "option" : "options") +
            "</div></div>";
          numFields.forEach(function (f) {
            var a = aggregate(f, rows);
            if (!a) return;
            tiles +=
              '<div class="stat"><div class="s-val">' +
              formatNum(f, a.avg) +
              '</div><div class="s-lab">avg ' +
              esc(f.label) +
              '</div><div class="s-sub">' +
              formatNum(f, a.min) +
              " – " +
              formatNum(f, a.max) +
              "</div></div>";
          });
          var chips = "";
          if (currentBest)
            chips +=
              '<div class="callout best"><span class="c-kick">★ Best value</span><span class="c-name">' +
              esc(currentBest[nameF.key]) +
              "</span></div>";
          schema.fields
            .filter(function (f) {
              return f.goal && NUMERIC[f.type];
            })
            .forEach(function (f) {
              var winner = null,
                wv = null;
              rows.forEach(function (r) {
                var v = Number(r[f.key]);
                if (isNaN(v)) return;
                if (wv === null || (f.goal === "min" ? v < wv : v > wv)) {
                  wv = v;
                  winner = r;
                }
              });
              if (!winner) return;
              chips +=
                '<div class="callout"><span class="c-kick">' +
                esc((f.goal === "min" ? "Lowest " : "Highest ") + f.label) +
                '</span><span class="c-name">' +
                esc(winner[nameF.key]) +
                '</span><span class="c-val">' +
                formatValue(f, winner[f.key]) +
                "</span></div>";
            });
          return (
            '<div class="stats">' +
            tiles +
            "</div>" +
            (chips ? '<div class="callouts">' + chips + "</div>" : "")
          );
        }
        var CONTAINER_TYPES = {
          offers: "Offer",
          aggregateRating: "AggregateRating",
          address: "PostalAddress",
          geo: "GeoCoordinates",
        };
        function setPath(o, p, val) {
          var ps = p.split("."),
            c = o;
          for (var i = 0; i < ps.length - 1; i++) {
            var k = ps[i];
            if (!c[k]) {
              c[k] = {};
              if (CONTAINER_TYPES[k]) c[k]["@type"] = CONTAINER_TYPES[k];
            }
            c = c[k];
          }
          c[ps[ps.length - 1]] = val;
        }
        function buildJsonLd(block) {
          var mapped = block.fields.filter(function (f) {
            return f.property;
          });
          return {
            "@context": "https://schema.org",
            "@type": "ItemList",
            name: block.title || "",
            numberOfItems: block.data.length,
            itemListElement: block.data.map(function (row, i) {
              var item = { "@type": block.itemType || "Thing" };
              mapped.forEach(function (f) {
                var v = row[f.key];
                if (v === undefined || v === null || v === "") return;
                var val = NUMERIC[f.type] ? Number(v) : v;
                setPath(item, f.property, val);
                if (f.type === "currency" && /\.price$/.test(f.property))
                  setPath(
                    item,
                    f.property.replace(/price$/, "priceCurrency"),
                    f.currency || "USD"
                  );
              });
              return { "@type": "ListItem", position: i + 1, item: item };
            }),
          };
        }
        function emitJsonLd() {
          var old = document.querySelectorAll("script.aitab-ld");
          for (var i = 0; i < old.length; i++)
            old[i].parentNode.removeChild(old[i]);
          (PAGE.blocks || [])
            .filter(function (b) {
              return b.type === "list" && b.itemType;
            })
            .forEach(function (b) {
              var s = document.createElement("script");
              s.type = "application/ld+json";
              s.className = "aitab-ld";
              s.textContent = JSON.stringify(buildJsonLd(b), null, 2);
              document.head.appendChild(s);
            });
        }

        /* ---- list layout sub-registry ------------------------------------------ */
        var LAYOUTS = {
          cards: function (schema, rows) {
            var titleF = firstByRole(schema, "title"),
              subF = firstByRole(schema, "subtitle"),
              details = byRole(schema, "detail");
            return rows
              .map(function (row) {
                var img = thumb(schema, row),
                  a = action(schema, row);
                var h =
                  '<div class="card' +
                  (img ? "" : " no-image") +
                  bestClass(row) +
                  '">' +
                  img +
                  '<div class="body">';
                h += '<div class="titlerow">';
                if (titleF)
                  h += '<h2 class="title">' + esc(row[titleF.key]) + "</h2>";
                h += badge(schema, row) + ribbon(row) + "</div>";
                if (has(row, subF))
                  h += '<p class="subtitle">' + esc(row[subF.key]) + "</p>";
                if (details.length) {
                  h += '<div class="details">';
                  details.forEach(function (f) {
                    if (!has(row, f)) return;
                    var full =
                      f.type === "tags" || f.type === "long" ? " full" : "";
                    h +=
                      '<div class="detail' +
                      full +
                      '"><div class="k">' +
                      esc(f.label) +
                      '</div><div class="v">' +
                      formatValue(f, row[f.key]) +
                      "</div></div>";
                  });
                  h += "</div>";
                }
                h += "</div>"; // body
                if (a) h += '<div class="action">' + a + "</div>";
                return h + "</div>";
              })
              .join("");
          },
          compact: function (schema, rows) {
            var titleF = firstByRole(schema, "title"),
              subF = firstByRole(schema, "subtitle");
            var details = byRole(schema, "detail").filter(function (f) {
              return f.type !== "long";
            });
            return rows
              .map(function (row) {
                var img = thumb(schema, row),
                  a = action(schema, row);
                var h =
                  '<div class="row' +
                  bestClass(row) +
                  '">' +
                  img +
                  '<div class="row-main">';
                if (titleF)
                  h += '<div class="title">' + esc(row[titleF.key]) + "</div>";
                h += has(row, subF)
                  ? '<div class="subtitle">' + esc(row[subF.key]) + "</div>"
                  : "";
                h += "</div>" + badge(schema, row) + ribbon(row);
                h += '<div class="row-meta">';
                details.forEach(function (f) {
                  if (has(row, f))
                    h +=
                      '<span class="m"><em>' +
                      esc(f.label) +
                      "</em>" +
                      formatValue(f, row[f.key]) +
                      "</span>";
                });
                h += "</div>";
                if (a) h += '<div class="action">' + a + "</div>";
                return h + "</div>";
              })
              .join("");
          },
          grid: function (schema, rows) {
            var titleF = firstByRole(schema, "title"),
              subF = firstByRole(schema, "subtitle"),
              details = byRole(schema, "detail");
            return rows
              .map(function (row) {
                var h =
                  '<div class="tile' +
                  bestClass(row) +
                  '">' +
                  thumb(schema, row) +
                  '<div class="tile-body">';
                h += '<div class="titlerow">';
                if (titleF)
                  h +=
                    '<span class="title">' + esc(row[titleF.key]) + "</span>";
                h += badge(schema, row) + ribbon(row) + "</div>";
                if (has(row, subF))
                  h += '<div class="subtitle">' + esc(row[subF.key]) + "</div>";
                if (details.length) {
                  h += '<div class="details">';
                  details.forEach(function (f) {
                    if (!has(row, f)) return;
                    var full =
                      f.type === "tags" || f.type === "long" ? " full" : "";
                    h +=
                      '<div class="detail' +
                      full +
                      '"><span class="k">' +
                      esc(f.label) +
                      '</span><span class="v">' +
                      formatValue(f, row[f.key]) +
                      "</span></div>";
                  });
                  h += "</div>";
                }
                var a = action(schema, row);
                if (a) h += '<div class="action">' + a + "</div>";
                return h + "</div></div>";
              })
              .join("");
          },
          table: function (schema, rows) {
            var titleF = firstByRole(schema, "title"),
              imageF = firstByRole(schema, "image"),
              badgeF = firstByRole(schema, "badge"),
              actionF = firstByRole(schema, "action");
            var cols = byRole(schema, "detail");
            var head =
              "<tr><th>" +
              esc(titleF ? titleF.label || "Name" : "Name") +
              "</th>";
            if (badgeF)
              head += "<th>" + esc(badgeF.label || "Status") + "</th>";
            cols.forEach(function (f) {
              head += "<th>" + esc(f.label) + "</th>";
            });
            if (actionF) head += "<th></th>";
            head += "</tr>";
            var body = rows
              .map(function (row) {
                var img =
                  imageF && has(row, imageF)
                    ? '<img class="thumb" loading="lazy" alt="" src="' +
                      esc(row[imageF.key]) +
                      '" onerror="this.style.display=\'none\'" />'
                    : "";
                var cls = bestClass(row).trim();
                var r = "<tr" + (cls ? ' class="' + cls + '"' : "") + ">";
                r +=
                  '<td><div class="cell-title">' +
                  img +
                  "<span>" +
                  esc(titleF ? row[titleF.key] : "") +
                  "</span>" +
                  ribbon(row) +
                  "</div></td>";
                if (badgeF) r += "<td>" + badge(schema, row) + "</td>";
                cols.forEach(function (f) {
                  r +=
                    "<td>" +
                    (has(row, f) ? formatValue(f, row[f.key]) : "—") +
                    "</td>";
                });
                if (actionF) r += "<td>" + action(schema, row) + "</td>";
                return r + "</tr>";
              })
              .join("");
            return (
              '<table class="tbl"><thead>' +
              head +
              "</thead><tbody>" +
              body +
              "</tbody></table>"
            );
          },
        };

        /* ==========================================================================
     BLOCK RENDERER REGISTRY — one entry per component `type`.
     Each returns an HTML string. This mirrors schemas/ 1:1.
     ========================================================================== */
        var RENDERERS = {
          header: function (b) {
            return (
              '<header class="page-header">' +
              (b.icon ? '<div class="ph-icon">' + esc(b.icon) + "</div>" : "") +
              "<div><h1>" +
              esc(b.title) +
              "</h1>" +
              (b.subhead
                ? '<p class="ph-sub">' + esc(b.subhead) + "</p>"
                : "") +
              "</div></header>"
            );
          },
          info: function (b) {
            var inner = "";
            if (b.icon)
              inner += '<div class="pi-icon">' + esc(b.icon) + "</div>";
            if (b.heading)
              inner += '<div class="pi-head">' + esc(b.heading) + "</div>";
            if (b.value)
              inner += '<div class="pi-val">' + esc(b.value) + "</div>";
            if (b.body)
              inner += '<div class="pi-body">' + esc(b.body) + "</div>";
            var cls =
              "panel panel-" +
              (b.size === "wide" ? "wide" : "square") +
              (b.accent ? " accent" : "");
            return b.href
              ? '<a class="' +
                  cls +
                  '" href="' +
                  esc(b.href) +
                  '">' +
                  inner +
                  "</a>"
              : '<div class="' + cls + '">' + inner + "</div>";
          },
          list: function (b) {
            var layout = LAYOUTS[b.layout] ? b.layout : "cards";
            var rows = b.data || [];
            currentBest = computeBest(b, rows);
            var summary = summaryHtml(b, rows);
            var listHtml = rows.length
              ? LAYOUTS[layout](b, rows)
              : '<div class="empty">No items.</div>';
            currentBest = null;
            return (
              '<section class="block list-block">' +
              (b.title
                ? '<h2 class="block-title">' + esc(b.title) + "</h2>"
                : "") +
              (b.description
                ? '<p class="block-desc">' + esc(b.description) + "</p>"
                : "") +
              (summary ? '<div class="summary">' + summary + "</div>" : "") +
              '<div class="list layout-' +
              layout +
              '">' +
              listHtml +
              "</div></section>"
            );
          },
          todo: function (b, index) {
            var items = b.items || [];
            var done = items.filter(function (t) {
              return t.done;
            }).length;
            var prog =
              b.showProgress !== false
                ? '<p class="todo-prog">' +
                  done +
                  " of " +
                  items.length +
                  " done</p>"
                : "";
            var lis = items
              .map(function (t, i) {
                var meta = "";
                if (t.priority)
                  meta +=
                    '<span class="pri ' +
                    esc(t.priority) +
                    '">' +
                    esc(t.priority) +
                    "</span>";
                if (t.due) meta += "<span>Due " + esc(t.due) + "</span>";
                if (t.note) meta += "<span>" + esc(t.note) + "</span>";
                if (t.href)
                  meta +=
                    '<a href="' +
                    esc(t.href) +
                    '" target="_blank" rel="noopener">Open ↗</a>';
                return (
                  '<li class="todo-item' +
                  (t.done ? " done" : "") +
                  '" data-idx="' +
                  i +
                  '">' +
                  '<label><input type="checkbox" class="todo-cb"' +
                  (t.done ? " checked" : "") +
                  "/>" +
                  '<span class="tx">' +
                  esc(t.text) +
                  "</span></label>" +
                  (meta ? '<div class="todo-meta">' + meta + "</div>" : "") +
                  "</li>"
                );
              })
              .join("");
            return (
              '<section class="block todo" data-block="' +
              index +
              '">' +
              (b.title
                ? '<h2 class="block-title">' + esc(b.title) + "</h2>"
                : "") +
              prog +
              '<ul class="todo-list">' +
              lis +
              "</ul></section>"
            );
          },
          footer: function (b) {
            var btns = (b.buttons || [])
              .map(function (btn) {
                return (
                  '<a class="btn ' +
                  (btn.variant === "primary" ? "primary" : "secondary") +
                  '" href="' +
                  esc(btn.href) +
                  '">' +
                  esc(btn.text) +
                  "</a>"
                );
              })
              .join("");
            return (
              '<footer class="page-footer">' +
              (b.text ? '<div class="pf-text">' + esc(b.text) + "</div>" : "") +
              '<div class="pf-buttons">' +
              btns +
              "</div></footer>"
            );
          },
        };

        /* ---- compose ----------------------------------------------------------- */
        function renderBody(blocks) {
          var out = "",
            i = 0;
          while (i < blocks.length) {
            var b = blocks[i];
            if (b.type === "info") {
              // group consecutive info panels so they tile
              var group = [];
              while (i < blocks.length && blocks[i].type === "info") {
                group.push(blocks[i]);
                i++;
              }
              out +=
                '<div class="panels">' +
                group.map(RENDERERS.info).join("") +
                "</div>";
            } else {
              out += RENDERERS[b.type] ? RENDERERS[b.type](b, i) : "";
              i++;
            }
          }
          return out;
        }
        function build() {
          var html = "";
          if (PAGE.header) html += RENDERERS.header(PAGE.header);
          html += renderBody(PAGE.blocks || []);
          if (PAGE.footer) html += RENDERERS.footer(PAGE.footer);
          root.innerHTML = html;
          emitJsonLd();
        }

        // interactive: toggling a todo checkbox updates state and rebuilds
        root.addEventListener("change", function (e) {
          if (!e.target.classList || !e.target.classList.contains("todo-cb"))
            return;
          var li = e.target.closest("[data-idx]"),
            sec = e.target.closest("[data-block]");
          if (!li || !sec) return;
          var block = PAGE.blocks[+sec.getAttribute("data-block")];
          if (block && block.items) {
            block.items[+li.getAttribute("data-idx")].done = e.target.checked;
            build();
          }
        });

        build();
      })();
    </script>
  </body>
</html>
