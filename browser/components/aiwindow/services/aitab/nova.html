<!doctype html>
<html lang="en" data-skin="nova">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AITab · Firefox</title>
    <!--
  AITAB EXTERNAL VIEWER — nova skin
  Photon / violet product chrome.
  Shared: aitab-viewer.css + aitab-viewer.js
  Skin overrides: inline <style> (after the link — cascade wins via
  html[data-skin="nova"] specificity).
    -->
    <link rel="stylesheet" href="aitab-viewer.css" />
    <style>
      /* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at http://mozilla.org/MPL/2.0/. */

      /**
 * Nova skin — load AFTER aitab-viewer.css (link then this block).
 * Scoped under html[data-skin="nova"] so tokens/components beat shared
 * [data-theme] rules. Dark uses [data-mode="dark"] (set by runtime) for
 * specificity over [data-theme][data-mode="dark"].
 */

      html[data-skin="nova"] {
        /* color/violet scale */
        --bg: #f2f0f8;
        --bg-elevated: #ffffff;
        --card: #ffffff;
        --ink: #161423;
        --ink-secondary: #584a7d;
        --muted: #75669f;
        --line: #d2c8ec;
        --line-soft: #e7e1f8;
        --accent: #764edd;
        --accent-hover: #5939a8;
        --accent-soft: #eaddff;
        --accent-glow: #9871ff;
        --chip: #f5ecff;
        --good: #2ac3a2;
        --warning: #ffa436;
        --danger: #e22850;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow:
          0 1px 2px rgba(62, 41, 118, 0.08), 0 2px 10px rgba(118, 78, 221, 0.08);
        --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-display:
          "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        --topbar-h: 56px;
      }

      /* Beat shared [data-theme="…"][data-mode="dark"] (0,2,0) with (0,2,1) */
      html[data-skin="nova"][data-mode="dark"] {
        --bg: #161423;
        --bg-elevated: #271c48;
        --card: #271c48;
        --ink: #f5ecff;
        --ink-secondary: #d4c1ff;
        --muted: #b89cff;
        --line: #584a7d;
        --line-soft: #3e2976;
        --accent: #b89cff;
        --accent-hover: #d4c1ff;
        --accent-soft: #3e2976;
        --accent-glow: #9871ff;
        --chip: #3e2976;
        --good: #54ffbd;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.45), 0 4px 18px rgba(118, 78, 221, 0.2);
      }

      /* Before JS sets data-mode, honor OS preference */
      @media (prefers-color-scheme: dark) {
        html[data-skin="nova"]:not([data-mode="light"]) {
          --bg: #161423;
          --bg-elevated: #271c48;
          --card: #271c48;
          --ink: #f5ecff;
          --ink-secondary: #d4c1ff;
          --muted: #b89cff;
          --line: #584a7d;
          --line-soft: #3e2976;
          --accent: #b89cff;
          --accent-hover: #d4c1ff;
          --accent-soft: #3e2976;
          --accent-glow: #9871ff;
          --chip: #3e2976;
          --good: #54ffbd;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.45), 0 4px 18px rgba(118, 78, 221, 0.2);
        }
      }

      html[data-skin="nova"],
      html[data-skin="nova"] body {
        margin: 0;
        min-height: 100%;
      }
      html[data-skin="nova"] body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* Top chrome bar — Nova violet toolbar */
      html[data-skin="nova"] .skin-chrome {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        background: linear-gradient(
          105deg,
          rgba(118, 78, 221, 0.14) 0%,
          rgba(245, 236, 255, 0.9) 42%,
          var(--bg-elevated) 100%
        );
        border-bottom: 1px solid var(--line-soft);
        box-shadow: 0 1px 0 rgba(118, 78, 221, 0.08);
      }
      html[data-skin="nova"] .skin-chrome::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          #764edd 0%,
          #9871ff 40%,
          #b89cff 70%,
          transparent 100%
        );
        pointer-events: none;
      }
      html[data-skin="nova"][data-mode="dark"] .skin-chrome,
      html[data-skin="nova"]:not([data-mode="light"]) .skin-chrome {
        /* dark chrome filled via tokens; explicit gradient for dark */
      }
      html[data-skin="nova"][data-mode="dark"] .skin-chrome {
        background: linear-gradient(
          105deg,
          rgba(118, 78, 221, 0.45) 0%,
          #271c48 55%,
          var(--bg-elevated) 100%
        );
      }
      @media (prefers-color-scheme: dark) {
        html[data-skin="nova"]:not([data-mode="light"]) .skin-chrome {
          background: linear-gradient(
            105deg,
            rgba(118, 78, 221, 0.45) 0%,
            #271c48 55%,
            var(--bg-elevated) 100%
          );
        }
      }
      html[data-skin="nova"] .skin-chrome .mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          #9871ff 0%,
          #764edd 50%,
          #5939a8 100%
        );
        box-shadow: 0 0 0 2px rgba(118, 78, 221, 0.25);
        flex: 0 0 auto;
      }
      html[data-skin="nova"] .skin-chrome .brand {
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: -0.01em;
        color: var(--accent-hover);
      }
      html[data-skin="nova"][data-mode="dark"] .skin-chrome .brand {
        color: var(--accent);
      }
      html[data-skin="nova"] .skin-chrome .pill {
        margin-left: auto;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #fff;
        background: linear-gradient(135deg, #9871ff, #764edd);
        padding: 4px 10px;
        border-radius: 999px;
        box-shadow: 0 1px 3px rgba(89, 57, 168, 0.35);
      }

      html[data-skin="nova"] .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 72px;
      }
      html[data-skin="nova"] .page-header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 28px;
        padding: 20px 22px;
        background: linear-gradient(
          135deg,
          var(--accent-soft) 0%,
          var(--card) 55%
        );
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        border-left: 4px solid var(--accent);
      }
      html[data-skin="nova"] .ph-icon {
        font-size: 2.4rem;
        line-height: 1;
        margin-top: 2px;
      }
      html[data-skin="nova"] .page-header h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      html[data-skin="nova"] .ph-sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      html[data-skin="nova"] .panels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      html[data-skin="nova"] .panel {
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow);
        color: inherit;
        text-decoration: none;
        display: block;
      }
      html[data-skin="nova"] a.panel {
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      html[data-skin="nova"] a.panel:hover {
        border-color: var(--accent);
        box-shadow:
          0 0 0 1px var(--accent),
          var(--shadow);
      }
      html[data-skin="nova"] .panel-wide {
        grid-column: 1 / -1;
      }
      html[data-skin="nova"] .panel.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      html[data-skin="nova"] .pi-icon {
        font-size: 1.25rem;
      }
      html[data-skin="nova"] .pi-head {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-top: 6px;
        font-weight: 600;
      }
      html[data-skin="nova"] .panel.accent .pi-head {
        color: rgba(255, 255, 255, 0.85);
      }
      html[data-skin="nova"] .pi-val {
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      html[data-skin="nova"] .pi-body {
        font-size: 0.92rem;
        margin-top: 6px;
        color: var(--ink-secondary);
      }
      html[data-skin="nova"] .panel.accent .pi-body {
        color: rgba(255, 255, 255, 0.92);
      }

      html[data-skin="nova"] .block {
        margin-bottom: 28px;
      }
      html[data-skin="nova"] .block-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      html[data-skin="nova"] .block-desc {
        color: var(--muted);
        margin: 0 0 12px;
        font-size: 0.92rem;
      }

      html[data-skin="nova"] .todo-prog {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0 0 12px;
      }
      html[data-skin="nova"] .todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      html[data-skin="nova"] .todo-item {
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }
      html[data-skin="nova"] .todo-item label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
      }
      html[data-skin="nova"] .todo-item input {
        margin-top: 3px;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      html[data-skin="nova"] .todo-item .tx {
        font-weight: 600;
      }
      html[data-skin="nova"] .todo-item.done .tx {
        text-decoration: line-through;
        color: var(--muted);
      }
      html[data-skin="nova"] .todo-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 6px 0 0 26px;
        font-size: 0.8rem;
        color: var(--muted);
        align-items: center;
      }
      html[data-skin="nova"] .todo-meta a {
        color: var(--accent);
      }
      html[data-skin="nova"] .pri {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--muted);
        font-weight: 600;
      }
      html[data-skin="nova"] .pri.high {
        background: var(--accent-soft);
        color: var(--accent);
      }

      html[data-skin="nova"] .page-footer {
        border-top: 1px solid var(--line-soft);
        margin-top: 40px;
        padding-top: 20px;
      }
      html[data-skin="nova"] .pf-text {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 12px;
      }
      html[data-skin="nova"] .pf-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      html[data-skin="nova"] .btn {
        display: inline-block;
        text-decoration: none;
        white-space: nowrap;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: var(--radius);
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s;
        border: 1px solid transparent;
        cursor: pointer;
        font: inherit;
      }
      html[data-skin="nova"] .btn.primary {
        background: linear-gradient(135deg, var(--accent-glow), var(--accent));
        color: #fff;
        box-shadow: 0 1px 4px rgba(118, 78, 221, 0.35);
      }
      html[data-skin="nova"] .btn.primary:hover {
        background: var(--accent-hover);
      }
      html[data-skin="nova"] .btn.secondary {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      html[data-skin="nova"] .btn.secondary:hover,
      html[data-skin="nova"] .btn.reshape:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      html[data-skin="nova"] .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      html[data-skin="nova"] .stars {
        color: #ffa436;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      html[data-skin="nova"] .stars .num {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: 4px;
        letter-spacing: 0;
      }
      html[data-skin="nova"] .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }
      html[data-skin="nova"] .chip {
        font-size: 0.78rem;
        background: var(--chip);
        color: var(--ink);
        padding: 3px 10px;
        border-radius: 999px;
        font-weight: 500;
      }
      html[data-skin="nova"] .bool.yes {
        color: var(--good);
        font-weight: 600;
      }
      html[data-skin="nova"] .bool.no {
        color: var(--muted);
      }
      html[data-skin="nova"] .empty {
        text-align: center;
        color: var(--muted);
        padding: 32px 0;
      }
      html[data-skin="nova"] .thumb {
        background: var(--chip);
        display: block;
        object-fit: cover;
      }
      html[data-skin="nova"] .ribbon {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
      }
      html[data-skin="nova"] .is-best {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      html[data-skin="nova"] .summary {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 16px;
      }
      html[data-skin="nova"] .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
      }
      html[data-skin="nova"] .stat {
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }
      html[data-skin="nova"] .stat .s-val {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      html[data-skin="nova"] .stat .s-lab {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-top: 2px;
        font-weight: 600;
      }
      html[data-skin="nova"] .stat .s-sub {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 4px;
      }
      html[data-skin="nova"] .callouts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      html[data-skin="nova"] .callout {
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        padding: 9px 14px;
        box-shadow: var(--shadow);
      }
      html[data-skin="nova"] .callout .c-kick {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
      }
      html[data-skin="nova"] .callout .c-name {
        font-weight: 650;
        font-size: 0.9rem;
      }
      html[data-skin="nova"] .callout .c-val {
        font-size: 0.8rem;
        color: var(--muted);
      }
      html[data-skin="nova"] .callout.best {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      html[data-skin="nova"] .callout.best .c-kick,
      html[data-skin="nova"] .callout.best .c-val {
        color: rgba(255, 255, 255, 0.85);
      }

      html[data-skin="nova"] .list.layout-cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      html[data-skin="nova"] .layout-cards .card {
        display: grid;
        grid-template-columns: 120px 1fr auto;
        gap: 18px;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 16px;
      }
      html[data-skin="nova"] .layout-cards .card.no-image {
        grid-template-columns: 1fr auto;
      }
      html[data-skin="nova"] .layout-cards .thumb {
        width: 120px;
        height: 120px;
        border-radius: var(--radius);
      }
      html[data-skin="nova"] .layout-cards .titlerow {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      html[data-skin="nova"] .layout-cards .title {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
      }
      html[data-skin="nova"] .layout-cards .subtitle {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 2px 0 0;
      }
      html[data-skin="nova"] .layout-cards .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px 18px;
        margin-top: 14px;
      }
      html[data-skin="nova"] .layout-cards .k {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
      }
      html[data-skin="nova"] .layout-cards .v {
        font-size: 0.92rem;
        font-weight: 600;
      }
      html[data-skin="nova"] .layout-cards .detail.full {
        grid-column: 1 / -1;
      }
      html[data-skin="nova"] .layout-cards .action {
        display: flex;
        align-items: center;
      }

      html[data-skin="nova"] .list.layout-compact {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      html[data-skin="nova"] .layout-compact .row {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        padding: 10px 14px;
        box-shadow: var(--shadow);
      }
      html[data-skin="nova"] .layout-compact .thumb {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        flex: 0 0 auto;
      }
      html[data-skin="nova"] .layout-compact .row-main {
        flex: 0 0 auto;
        min-width: 180px;
        max-width: 280px;
      }
      html[data-skin="nova"] .layout-compact .title {
        font-weight: 700;
        font-size: 0.98rem;
      }
      html[data-skin="nova"] .layout-compact .subtitle {
        color: var(--muted);
        font-size: 0.8rem;
      }
      html[data-skin="nova"] .layout-compact .row-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        flex: 1 1 auto;
        align-items: center;
      }
      html[data-skin="nova"] .layout-compact .m {
        font-size: 0.85rem;
      }
      html[data-skin="nova"] .layout-compact .m em {
        color: var(--muted);
        font-style: normal;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-right: 5px;
        font-weight: 600;
      }

      html[data-skin="nova"] .list.layout-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      html[data-skin="nova"] .layout-grid .tile {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      html[data-skin="nova"] .layout-grid .thumb {
        width: 100%;
        height: 150px;
      }
      html[data-skin="nova"] .layout-grid .tile-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      html[data-skin="nova"] .layout-grid .titlerow {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      html[data-skin="nova"] .layout-grid .title {
        font-weight: 700;
        font-size: 1.02rem;
      }
      html[data-skin="nova"] .layout-grid .subtitle {
        color: var(--muted);
        font-size: 0.8rem;
      }
      html[data-skin="nova"] .layout-grid .details {
        display: grid;
        gap: 6px;
        margin-top: 4px;
      }
      html[data-skin="nova"] .layout-grid .detail {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.85rem;
      }
      html[data-skin="nova"] .layout-grid .k {
        color: var(--muted);
      }
      html[data-skin="nova"] .layout-grid .detail.full {
        flex-direction: column;
      }
      html[data-skin="nova"] .layout-grid .action {
        margin-top: auto;
        padding-top: 10px;
      }

      html[data-skin="nova"] .list.layout-table {
        display: block;
        overflow-x: auto;
      }
      html[data-skin="nova"] .layout-table .tbl {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      html[data-skin="nova"] .layout-table th,
      html[data-skin="nova"] .layout-table td {
        padding: 12px 14px;
        text-align: left;
        vertical-align: middle;
        font-size: 0.9rem;
      }
      html[data-skin="nova"] .layout-table thead th {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        background: var(--chip);
        white-space: nowrap;
        font-weight: 700;
      }
      html[data-skin="nova"] .layout-table tbody tr + tr td {
        border-top: 1px solid var(--line-soft);
      }
      html[data-skin="nova"] .layout-table td:first-child {
        font-weight: 600;
      }
      html[data-skin="nova"] .layout-table .thumb {
        width: 40px;
        height: 40px;
        border-radius: 6px;
      }
      html[data-skin="nova"] .layout-table .cell-title {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      html[data-skin="nova"] .layout-table tr.is-best td {
        background: var(--accent-soft);
      }

      /* Modify affordances use skin accent */
      html[data-skin="nova"] .mod-add-bar:hover,
      html[data-skin="nova"] .mod-add-bar:focus-visible {
        border-color: var(--accent);

      @media (max-width: 600px) {
        html[data-skin="nova"] .layout-cards .card,
        html[data-skin="nova"] .layout-cards .card.no-image {
          grid-template-columns: 1fr;
        }
        html[data-skin="nova"] .layout-cards .thumb {
          width: 100%;
          height: 160px;
        }
      }
    </style>
  </head>
