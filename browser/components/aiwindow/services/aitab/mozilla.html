<!doctype html>
<html lang="en" data-skin="mozilla">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AITab · Mozilla</title>
    <!--
  AITAB EXTERNAL VIEWER — mozilla skin
  mozilla.org marketing look (Zilla Slab + Inter, black CTAs).
  Shared: aitab-viewer.css + aitab-viewer.js
  Skin overrides: inline <style> after the shared link.
    -->
    <link rel="stylesheet" href="aitab-viewer.css" />
    <style>
      /* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at http://mozilla.org/MPL/2.0/. */

      /**
 * Mozilla skin — load AFTER aitab-viewer.css.
 * Scoped under html[data-skin="mozilla"]. Dark uses [data-mode="dark"]
 * so tokens beat shared [data-theme][data-mode="dark"].
 */

      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap");

      html[data-skin="mozilla"] {
        --bg: #ffffff;
        --bg-alt: #f9f9fa;
        --card: #ffffff;
        --ink: #000000;
        --ink-secondary: #42414d;
        --muted: #5b5b66;
        --line: #e0e0e6;
        --accent: #000000;
        --accent-soft: #f0f0f4;
        --chip: #f0f0f4;
        --good: #017a4c;
        --link: #0060df;
        --moz-red: #ff293b;
        --radius: 4px;
        --shadow: none;
        --font: "Inter", "Helvetica Neue", Arial, sans-serif;
        --font-display: "Zilla Slab", "Georgia", "Times New Roman", serif;
        --max: 1080px;
      }

      html[data-skin="mozilla"][data-mode="dark"] {
        --bg: #000000;
        --bg-alt: #1c1b22;
        --card: #1c1b22;
        --ink: #ffffff;
        --ink-secondary: #cfcfd8;
        --muted: #9e9ead;
        --line: #3a3944;
        --accent: #ffffff;
        --accent-soft: #2b2a33;
        --chip: #2b2a33;
        --good: #54ffbd;
        --link: #0df;
        --moz-red: #ff6a75;
      }

      @media (prefers-color-scheme: dark) {
        html[data-skin="mozilla"]:not([data-mode="light"]) {
          --bg: #000000;
          --bg-alt: #1c1b22;
          --card: #1c1b22;
          --ink: #ffffff;
          --ink-secondary: #cfcfd8;
          --muted: #9e9ead;
          --line: #3a3944;
          --accent: #ffffff;
          --accent-soft: #2b2a33;
          --chip: #2b2a33;
          --good: #54ffbd;
          --link: #0df;
          --moz-red: #ff6a75;
        }
      }

      html[data-skin="mozilla"],
      html[data-skin="mozilla"] body {
        margin: 0;
        min-height: 100%;
      }
      html[data-skin="mozilla"] body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      html[data-skin="mozilla"] .skin-chrome {
        border-bottom: 1px solid var(--line);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--bg);
      }
      html[data-skin="mozilla"] .skin-chrome .wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        color: var(--ink);
        text-decoration: none;
      }
      html[data-skin="mozilla"] .skin-chrome .wordmark span {
        color: var(--moz-red);
      }
      html[data-skin="mozilla"] .skin-chrome .tag {
        margin-left: auto;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      html[data-skin="mozilla"] .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 48px 24px 96px;
      }

      html[data-skin="mozilla"] .page-header {
        display: block;
        margin-bottom: 48px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--line);
      }
      html[data-skin="mozilla"] .ph-icon {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 16px;
        display: block;
      }
      html[data-skin="mozilla"] .page-header h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
        max-width: 18ch;
      }
      html[data-skin="mozilla"] .ph-sub {
        margin: 16px 0 0;
        color: var(--ink-secondary);
        font-size: 1.15rem;
        max-width: 42ch;
        line-height: 1.5;
      }

      html[data-skin="mozilla"] .panels {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }
      html[data-skin="mozilla"] .panel {
        background: var(--bg-alt);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px 20px;
        color: inherit;
        text-decoration: none;
        display: block;
      }
      html[data-skin="mozilla"] a.panel {
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      html[data-skin="mozilla"] a.panel:hover {
        border-color: var(--ink);
        background: var(--card);
      }
      html[data-skin="mozilla"] .panel-wide {
        grid-column: 1 / -1;
      }
      html[data-skin="mozilla"] .panel.accent {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--bg);
      }
      html[data-skin="mozilla"] .pi-icon {
        font-size: 1.5rem;
      }
      html[data-skin="mozilla"] .pi-head {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 12px;
        font-weight: 600;
      }
      html[data-skin="mozilla"] .panel.accent .pi-head {
        color: rgba(255, 255, 255, 0.7);
      }
      html[data-skin="mozilla"][data-mode="dark"] .panel.accent .pi-head {
        color: rgba(0, 0, 0, 0.55);
      }
      html[data-skin="mozilla"] .pi-val {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-top: 4px;
        line-height: 1.15;
      }
      html[data-skin="mozilla"] .pi-body {
        font-size: 1rem;
        margin-top: 10px;
        color: var(--ink-secondary);
        max-width: 60ch;
      }
      html[data-skin="mozilla"] .panel.accent .pi-body {
        color: inherit;
        opacity: 0.9;
      }

      html[data-skin="mozilla"] .block {
        margin-bottom: 48px;
      }
      html[data-skin="mozilla"] .block-title {
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      html[data-skin="mozilla"] .block-desc {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 1rem;
        max-width: 50ch;
      }

      html[data-skin="mozilla"] .todo-prog {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0 0 16px;
        font-weight: 500;
      }
      html[data-skin="mozilla"] .todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        border-top: 1px solid var(--line);
      }
      html[data-skin="mozilla"] .todo-item {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 18px 4px;
        box-shadow: none;
      }
      html[data-skin="mozilla"] .todo-item label {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        cursor: pointer;
      }
      html[data-skin="mozilla"] .todo-item input {
        margin-top: 4px;
        width: 18px;
        height: 18px;
        accent-color: var(--ink);
      }
      html[data-skin="mozilla"] .todo-item .tx {
        font-weight: 600;
        font-size: 1.05rem;
      }
      html[data-skin="mozilla"] .todo-item.done .tx {
        text-decoration: line-through;
        color: var(--muted);
      }
      html[data-skin="mozilla"] .todo-meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 8px 0 0 32px;
        font-size: 0.85rem;
        color: var(--muted);
        align-items: center;
      }
      html[data-skin="mozilla"] .todo-meta a {
        color: var(--link);
      }
      html[data-skin="mozilla"] .pri {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 2px;
        background: var(--chip);
        color: var(--muted);
        font-weight: 700;
      }
      html[data-skin="mozilla"] .pri.high {
        background: var(--ink);
        color: var(--bg);
      }

      html[data-skin="mozilla"] .page-footer {
        border-top: 2px solid var(--ink);
        margin-top: 56px;
        padding-top: 28px;
      }
      html[data-skin="mozilla"] .pf-text {
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 16px;
      }
      html[data-skin="mozilla"] .pf-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      html[data-skin="mozilla"] .btn {
        display: inline-block;
        text-decoration: none;
        white-space: nowrap;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 14px 28px;
        border-radius: 100px;
        transition:
          transform 0.12s,
          background 0.12s,
          color 0.12s;
        letter-spacing: 0.01em;
        cursor: pointer;
        font-family: inherit;
        border: 2px solid transparent;
      }
      html[data-skin="mozilla"] .btn:hover {
        transform: translateY(-1px);
      }
      html[data-skin="mozilla"] .btn.primary {
        background: var(--ink);
        color: var(--bg);
        border: 2px solid var(--ink);
      }
      html[data-skin="mozilla"] .btn.primary:hover {
        opacity: 0.88;
      }
      html[data-skin="mozilla"] .btn.secondary,
      html[data-skin="mozilla"] .btn.reshape {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--ink);
      }
      html[data-skin="mozilla"] .btn.secondary:hover,
      html[data-skin="mozilla"] .btn.reshape:hover {
        background: var(--accent-soft);
      }

      html[data-skin="mozilla"] .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 2px;
        background: var(--chip);
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      html[data-skin="mozilla"] .stars {
        color: var(--ink);
        letter-spacing: 1px;
        white-space: nowrap;
      }
      html[data-skin="mozilla"] .stars .num {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: 4px;
        letter-spacing: 0;
      }
      html[data-skin="mozilla"] .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      html[data-skin="mozilla"] .chip {
        font-size: 0.8rem;
        background: var(--chip);
        color: var(--ink);
        padding: 4px 12px;
        border-radius: 100px;
        font-weight: 500;
      }
      html[data-skin="mozilla"] .bool.yes {
        color: var(--good);
        font-weight: 700;
      }
      html[data-skin="mozilla"] .bool.no {
        color: var(--muted);
      }
      html[data-skin="mozilla"] .empty {
        text-align: center;
        color: var(--muted);
        padding: 48px 0;
      }
      html[data-skin="mozilla"] .thumb {
        background: var(--chip);
        display: block;
        object-fit: cover;
      }
      html[data-skin="mozilla"] .ribbon {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 2px;
        background: var(--moz-red);
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      html[data-skin="mozilla"] .is-best {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      html[data-skin="mozilla"] .summary {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 24px;
      }
      html[data-skin="mozilla"] .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      html[data-skin="mozilla"] .stat {
        background: var(--bg-alt);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 16px;
      }
      html[data-skin="mozilla"] .stat .s-val {
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      html[data-skin="mozilla"] .stat .s-lab {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 600;
      }
      html[data-skin="mozilla"] .stat .s-sub {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 6px;
      }
      html[data-skin="mozilla"] .callouts {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      html[data-skin="mozilla"] .callout {
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: var(--bg-alt);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 16px;
        min-width: 140px;
      }
      html[data-skin="mozilla"] .callout .c-kick {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
      }
      html[data-skin="mozilla"] .callout .c-name {
        font-weight: 700;
        font-size: 0.95rem;
      }
      html[data-skin="mozilla"] .callout .c-val {
        font-size: 0.85rem;
        color: var(--muted);
      }
      html[data-skin="mozilla"] .callout.best {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--bg);
      }
      html[data-skin="mozilla"] .callout.best .c-kick,
      html[data-skin="mozilla"] .callout.best .c-val {
        color: inherit;
        opacity: 0.75;
      }

      html[data-skin="mozilla"] .list.layout-cards {
        display: flex;
        flex-direction: column;
        gap: 0;
        border-top: 1px solid var(--line);
      }
      html[data-skin="mozilla"] .layout-cards .card {
        display: grid;
        grid-template-columns: 140px 1fr auto;
        gap: 24px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        box-shadow: none;
        padding: 28px 4px;
      }
      html[data-skin="mozilla"] .layout-cards .card.no-image {
        grid-template-columns: 1fr auto;
      }
      html[data-skin="mozilla"] .layout-cards .thumb {
        width: 140px;
        height: 140px;
        border-radius: var(--radius);
      }
      html[data-skin="mozilla"] .layout-cards .titlerow {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      html[data-skin="mozilla"] .layout-cards .title {
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.02em;
      }
      html[data-skin="mozilla"] .layout-cards .subtitle {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 4px 0 0;
      }
      html[data-skin="mozilla"] .layout-cards .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px 20px;
        margin-top: 18px;
      }
      html[data-skin="mozilla"] .layout-cards .k {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
      }
      html[data-skin="mozilla"] .layout-cards .v {
        font-size: 0.95rem;
        font-weight: 600;
      }
      html[data-skin="mozilla"] .layout-cards .detail.full {
        grid-column: 1 / -1;
      }
      html[data-skin="mozilla"] .layout-cards .action {
        display: flex;
        align-items: center;
      }

      html[data-skin="mozilla"] .list.layout-compact {
        display: flex;
        flex-direction: column;
        gap: 0;
        border-top: 1px solid var(--line);
      }
      html[data-skin="mozilla"] .layout-compact .row {
        display: flex;
        align-items: center;
        gap: 16px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 16px 4px;
        box-shadow: none;
      }
      html[data-skin="mozilla"] .layout-compact .thumb {
        width: 48px;
        height: 48px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      html[data-skin="mozilla"] .layout-compact .row-main {
        flex: 0 0 auto;
        min-width: 180px;
        max-width: 300px;
      }
      html[data-skin="mozilla"] .layout-compact .title {
        font-weight: 700;
        font-size: 1rem;
      }
      html[data-skin="mozilla"] .layout-compact .subtitle {
        color: var(--muted);
        font-size: 0.85rem;
      }
      html[data-skin="mozilla"] .layout-compact .row-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        flex: 1 1 auto;
        align-items: center;
      }
      html[data-skin="mozilla"] .layout-compact .m {
        font-size: 0.9rem;
      }
      html[data-skin="mozilla"] .layout-compact .m em {
        color: var(--muted);
        font-style: normal;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-right: 6px;
        font-weight: 600;
      }

      html[data-skin="mozilla"] .list.layout-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
      }
      html[data-skin="mozilla"] .layout-grid .tile {
        display: flex;
        flex-direction: column;
        background: var(--bg-alt);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: none;
        overflow: hidden;
      }
      html[data-skin="mozilla"] .layout-grid .thumb {
        width: 100%;
        height: 160px;
      }
      html[data-skin="mozilla"] .layout-grid .tile-body {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      html[data-skin="mozilla"] .layout-grid .titlerow {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      html[data-skin="mozilla"] .layout-grid .title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
      }
      html[data-skin="mozilla"] .layout-grid .subtitle {
        color: var(--muted);
        font-size: 0.85rem;
      }
      html[data-skin="mozilla"] .layout-grid .details {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }
      html[data-skin="mozilla"] .layout-grid .detail {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.9rem;
      }
      html[data-skin="mozilla"] .layout-grid .k {
        color: var(--muted);
      }
      html[data-skin="mozilla"] .layout-grid .detail.full {
        flex-direction: column;
      }
      html[data-skin="mozilla"] .layout-grid .action {
        margin-top: auto;
        padding-top: 14px;
      }

      html[data-skin="mozilla"] .list.layout-table {
        display: block;
        overflow-x: auto;
      }
      html[data-skin="mozilla"] .layout-table .tbl {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        background: transparent;
        border: none;
        border-radius: 0;
        overflow: visible;
        box-shadow: none;
      }
      html[data-skin="mozilla"] .layout-table th,
      html[data-skin="mozilla"] .layout-table td {
        padding: 16px 12px;
        text-align: left;
        vertical-align: middle;
        font-size: 0.95rem;
        border-bottom: 1px solid var(--line);
      }
      html[data-skin="mozilla"] .layout-table thead th {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: transparent;
        white-space: nowrap;
        font-weight: 700;
        border-bottom: 2px solid var(--ink);
      }
      html[data-skin="mozilla"] .layout-table td:first-child {
        font-weight: 700;
      }
      html[data-skin="mozilla"] .layout-table .thumb {
        width: 40px;
        height: 40px;
        border-radius: 2px;
      }
      html[data-skin="mozilla"] .layout-table .cell-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      html[data-skin="mozilla"] .layout-table tr.is-best td {
        background: var(--bg-alt);
      }

      html[data-skin="mozilla"] .mod-add-bar:hover,
      html[data-skin="mozilla"] .mod-add-bar:focus-visible {
        border-color: var(--ink);
        background: var(--accent-soft);
        color: var(--ink);
      }

      @media (max-width: 600px) {
        html[data-skin="mozilla"] .layout-cards .card,
        html[data-skin="mozilla"] .layout-cards .card.no-image {
          grid-template-columns: 1fr;
        }
        html[data-skin="mozilla"] .layout-cards .thumb {
          width: 100%;
          height: 180px;
        }
        html[data-skin="mozilla"] .wrap {
          padding: 32px 16px 72px;
        }
      }
    </style>
  </head>
  <body>
    <header class="skin-chrome" aria-label="Mozilla">
      <div class="wordmark">moz<span>illa</span></div>
      <div class="tag">Internet for people</div>
    </header>
    <main class="wrap" id="page"></main>
    <script src="aitab-viewer.js"></script>
  </body>
</html>
