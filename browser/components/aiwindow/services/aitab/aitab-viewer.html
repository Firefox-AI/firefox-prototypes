<!doctype html>
<html lang="en" data-theme="firefox" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AITab</title>
    <!--
  AITAB EXTERNAL VIEWER (default skin)
  ----------------------------------------------------------------------------
  Host this directory (HTML + aitab-viewer.js + aitab-viewer.css) and set:
    browser.smartwindow.aitab.viewerURL = https://your.host/path/aitab-viewer.html

  Skins (same runtime + CSS + hash protocol):
    nova.html / mozilla.html / modify.html

  Page JSON lives in the URL hash. Hashless loads use the embedded default
  page and rewrite the hash so reshape/refine_aitab can read this tab.
    -->
    <link rel="stylesheet" href="aitab-viewer.css" />
  </head>
  <body>
    <main class="wrap" id="page"></main>
    <script src="aitab-viewer.js"></script>
  </body>
</html>
