<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Browse Agent Test Page</title>
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      #scroller {
        height: 100px;
        overflow-y: auto;
        border: 1px solid black;
      }
      #scroller div {
        height: 500px;
      }
      #hidden {
        display: none;
      }
      #tall {
        height: 3000px;
      }
    </style>
  </head>
  <body>
    <h1>Browse Agent Test Page</h1>
    <form id="form">
      <input id="q" name="q" placeholder="Search products" autocomplete="off" />
      <button id="go" type="submit">Search</button>
    </form>
    <button id="add">Add to cart</button>
    <select id="size" aria-label="Size">
      <option value="s">Small</option>
      <option value="m">Medium</option>
      <option value="l">Large</option>
    </select>
    <a id="link" href="#details">Product details</a>
    <button id="hidden">Hidden button</button>
    <div id="hoverable">Hover me</div>
    <div id="scroller"><div>Scrollable content</div></div>
    <p id="result">idle</p>
    <div id="tall"></div>
    <button id="far">Far away button</button>
    <script>
      const result = document.getElementById("result");
      document.getElementById("form").addEventListener("submit", event => {
        event.preventDefault();
        result.textContent = "submitted:" + document.getElementById("q").value;
      });
      document.getElementById("add").addEventListener("click", () => {
        result.textContent = "added";
      });
      document.getElementById("size").addEventListener("change", event => {
        result.textContent = "size:" + event.target.value;
      });
      document.getElementById("hoverable").addEventListener("mouseover", () => {
        result.textContent = "hovered";
      });
      document.getElementById("far").addEventListener("click", () => {
        result.textContent = "far-clicked";
      });
    </script>
  </body>
</html>
