<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; object-src 'none'; script-src resource: chrome:; img-src chrome:; style-src resource: chrome:;"
    />
    <title>GenTab</title>
    <link
      rel="icon"
      type="image/png"
      href="chrome://branding/content/icon32.png"
    />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/aboutwelcome/aboutwelcome.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/aiwindow/firstrun.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/aiwindow/gentab.css"
    />
    <link rel="localization" href="browser/aiWindow.ftl" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="toolkit/branding/brandings.ftl" />
  </head>
  <body>
    <div id="gentab-status" class="gentab-status" hidden>
      <p id="gentab-status-message" class="gentab-status-message"></p>
    </div>
    <header id="gentab-header" class="gentab-header" hidden>
      <div class="gentab-header-inner">
        <div class="gentab-header-top">
          <span
            id="gentab-header-emoji"
            class="gentab-header-emoji"
            aria-hidden="true"
            >✨</span
          >
          <div class="gentab-header-meta">
            <p id="gentab-header-generated" class="gentab-header-generated">
              Generated just now
            </p>
            <h1 id="gentab-header-title" class="gentab-header-title">GenTab</h1>
            <p id="gentab-header-blurb" class="gentab-header-blurb"></p>
          </div>
        </div>
        <div class="gentab-header-controls">
          <!-- Intent: later becomes a combobox (suggested intents + free entry → regenerate). -->
          <button
            type="button"
            id="gentab-intent-control"
            class="gentab-chip gentab-chip-intent"
            disabled
            title="Intent editing coming soon — will regenerate GenTab"
          >
            <span class="gentab-chip-label">Intent</span>
            <span id="gentab-intent-value" class="gentab-chip-value">—</span>
            <span class="gentab-chip-caret" aria-hidden="true">▾</span>
          </button>
          <!-- Tabs: later opens source picker to add/remove tabs → regenerate. -->
          <button
            type="button"
            id="gentab-tabs-control"
            class="gentab-chip gentab-chip-tabs"
            disabled
            title="Source tabs management coming soon — will regenerate GenTab"
          >
            <span class="gentab-chip-label">Tabs</span>
            <span id="gentab-tabs-value" class="gentab-chip-value">›</span>
          </button>
        </div>
      </div>
    </header>
    <div
      id="multi-stage-message-root"
      class="welcome-container"
      role="presentation"
    ></div>
    <script src="chrome://global/content/vendor/react.js"></script>
    <script src="chrome://global/content/vendor/react-dom.js"></script>
    <script src="chrome://browser/content/contentTheme.js"></script>
    <script src="chrome://browser/content/aiwindow/gentab.js"></script>
  </body>
</html>
