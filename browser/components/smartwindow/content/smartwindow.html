<!doctype html>
<html class="smart-window">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/smartwindow/smartwindow.css"
    />
    <link
      rel="icon"
      href="chrome://browser/content/smartwindow/favicon.svg"
      type="image/svg+xml"
    />

  <body>
    <div id="root">
      <div class="key-setup-container">
        <div class="key-setup-content">
          <h2>Enter API Key</h2>
          <p>Enter your API key to enable Smart Window features:</p>
          <div class="key-input-container">
            <input
              type="password"
              id="key-input"
              placeholder="Enter API key"
              class="key-input"
            />
            <button id="key-submit" class="key-submit-button">Setup</button>
          </div>
          <div class="key-error" id="key-error" style="display: none"></div>
        </div>
      </div>
      <div class="smart-window-container">

          id="toggle-insights-button"

          aria-haspopup="dialog"
          aria-expanded="false"

          class="toggle-insights-popover"
          role="dialog"
          aria-modal="false"
          aria-labelledby="toggle-insights-popover-title"
          hidden

              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"

            <h4 id="toggle-insights-popover-title">Insights</h4>

              id="toggle-insights-close"
              class="toggle-insights-close-btn"
              aria-label="Close"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"

                  d="M7.11606 7.99994L4 11.116L4.88388 11.9999L7.99994 8.88383L11.116 11.9999L11.9999 11.116L8.88383 7.99994L11.9999 4.88388L11.116 4L7.99994 7.11606L4.88388 4L4 4.88388L7.11606 7.99994Z"
                  fill="#5B5B66"
                />
              </svg>
            </button>
          </div>
          <div class="toggle-insights-body">
            <p class="toggle-insights-help">
              Insights will be applied to responses in this chat.
              <a href="https://support.mozilla.org/" tabindex="-1"
                >Learn more</a
              >
            </p>
            <div class="toggle-insights-switch-row">
              <span>On</span>
              <button
                id="toggle-insights-switch"
                role="switch"
                aria-checked="true"
                class="toggle-insights-switch on"
              >
                <span class="knob" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="results-wrapper">
          <div id="results-container">
            <chat-bot id="chat-bot"></chat-bot>
          </div>
        </div>

            <span class="tab-title" id="current-tab-title"></span>
          </div>

            <div id="tiptap-editor" class="tiptap-editor"></div>
          </div>
          <div class="tab-context-bar" id="tab-context-bar">
            <div class="tab-context-left">
              <span class="pickers-container">
                <select class="model-picker" id="model-picker">
                  <option value="qwen3-235b-a22b-instruct-2507-maas">
                    qwen

                  <option value="gpt-4o">gpt-4o</option>
                  <option value="gpt-5-mini">gpt-5-mini</option>
                  <option value="gpt-5">gpt-5</option>
                  <option value="gpt-3.5-turbo">gpt-3.5</option>
                  <option value="mistral-small-2503">mistral</option>
                </select>
              </span>
            </div>
            <div class="tab-context-right">
              <div class="add-tabs-button" id="add-tabs-button">

                  height="24"

                  <div class="favicon-stack"></div>
                  <span class="tab-count">0 tabs</span>
                </div>
              </div>
              <combined-button-select
                id="combined-button-select"
                button-text="→"
                selected-value="auto"

            <moz-button

              id="open-smart-window"
              iconsrc="chrome://browser/content/smartwindow/smart-fx-icon.svg"
              label="Open Smart Window"
            ></moz-button>
          </div>
        </div>
