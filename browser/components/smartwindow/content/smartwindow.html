<!doctype html>
<html class="smart-window">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask</title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/smartwindow/smartwindow.css"
    />
    <link
      rel="icon"
      href="chrome://browser/skin/notification-icons/desktop-notification.svg"
    />
  </head>
  <body>
    <div id="root">
      <div class="key-setup-container">
        <div class="key-setup-content">
          <h2>Enter API Key</h2>
          <p>Enter your API key to enable Smart Window features:</p>
          <div class="key-input-container">
            <input
              type="password"
              id="key-input"
              placeholder="Enter API key"
              class="key-input"
            />
            <button id="key-submit" class="key-submit-button">Setup</button>
          </div>
          <div class="key-error" id="key-error" style="display: none"></div>
        </div>
      </div>
      <div class="smart-window-container">
        <div id="results-container">
          <chat-bot id="chat-bot"></chat-bot>
        </div>
        <div class="search-box">
          <div class="input-container">
            <div id="tiptap-editor" class="tiptap-editor"></div>
          </div>
          <div class="tab-context-bar" id="tab-context-bar">
            <div class="tab-context-left">
              <div class="current-tab-button" id="current-tab-button">
                <img
                  class="tab-favicon"
                  id="current-tab-favicon"
                  src=""
                  alt=""
                />
                <span class="tab-title" id="current-tab-title"
                  >current tab</span
                >
                <button class="remove-tab-button" id="remove-current-tab">
                  ×
                </button>
              </div>
              <div class="add-tabs-button" id="add-tabs-button">
                <svg
                  class="add-tabs-icon"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M11.2709 13.3125V18.2709C11.2709 18.4642 11.3476 18.6497 11.4844 18.7864C11.6211 18.9232 11.8066 19 12 19C12.1934 19 12.3789 18.9232 12.5156 18.7864C12.6524 18.6497 12.7292 18.4642 12.7292 18.2709V13.3125L13.3125 12.7291H18.2709C18.4643 12.7291 18.6498 12.6524 18.7864 12.5156C18.9232 12.3789 19 12.1934 19 12C19 11.8066 18.9232 11.6211 18.7864 11.4844C18.6498 11.3477 18.4643 11.2709 18.2709 11.2709H13.3125L12.7292 10.6875V5.72916C12.7292 5.53578 12.6524 5.35031 12.5156 5.21356C12.3789 5.07682 12.1934 5 12 5C11.8066 5 11.6211 5.07682 11.4844 5.21356C11.3476 5.35031 11.2709 5.53578 11.2709 5.72916V10.6875L10.6875 11.2709H5.72916C5.53578 11.2709 5.35031 11.3477 5.21356 11.4844C5.07682 11.6211 5 11.8066 5 12C5 12.1934 5.07682 12.3789 5.21356 12.5156C5.35031 12.6524 5.53578 12.7291 5.72916 12.7291H10.5557L11.2709 13.3125Z"
                    fill="currentColor"
                  />
                </svg>
                <span class="add-tabs-text">Add images, tabs, files</span>
                <div
                  class="overlapping-favicons"
                  id="overlapping-favicons"
                  style="display: none"
                >
                  <div class="favicon-stack"></div>
                  <span class="tab-count">0 tabs</span>
                </div>
              </div>
            </div>
            <div class="tab-context-right">
              <select class="model-picker" id="model-picker">
                <option value="qwen3-235b-a22b-instruct-2507-maas">qwen</option>
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-5-mini">gpt-5-mini</option>
                <option value="gpt-5">gpt-5</option>
                <option value="gpt-3.5-turbo">gpt-3.5</option>
                <option value="mistral-small-2503">mistral</option>
              </select>
              <select class="query-type-picker" id="query-type-picker">
                <option value="auto">Auto</option>
                <option value="chat">Chat</option>
                <option value="search">Search</option>
                <option value="navigate">Navigate</option>
                <option value="action">Action</option>
              </select>
              <button class="submit-button" id="submit-button">
                <span class="button-text">→</span>
              </button>
            </div>
            <div class="tab-dropdown" id="tab-dropdown" style="display: none">
              <div class="dropdown-header">Select tabs for context:</div>
              <div class="dropdown-list" id="dropdown-list"></div>
            </div>
          </div>
          <div class="smart-window-cta">
            <moz-button
              class="open-smart-window-button"
              id="open-smart-window"
              iconsrc="chrome://browser/content/smartwindow/smart-fx-icon.svg"
              label="Open Smart Window"
            ></moz-button>
          </div>
        </div>
        <div class="quick-prompts-container" id="quick-prompts-container">
          <!-- Quick prompts will be dynamically inserted here -->
        </div>
        <div class="quick-actions" id="quick-actions">
          <button class="quick-action-button" id="history-button">
            <svg
              class="quick-action-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"
                fill="currentColor"
              />
            </svg>
            <span class="quick-action-text">History</span>
          </button>
          <button class="quick-action-button" id="insights-button">
            <svg
              class="quick-action-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4zm2.5 2.1h-15V5h15v14.1zm0-16.1h-15c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"
                fill="currentColor"
              />
            </svg>
            <span class="quick-action-text">Insights</span>
          </button>
          <button class="quick-action-button" id="chats-button" disabled>
            <svg
              class="quick-action-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"
                fill="currentColor"
              />
            </svg>
            <span class="quick-action-text">Chats</span>
          </button>
          <button class="quick-action-button" id="downloads-button" disabled>
            <svg
              class="quick-action-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M5 20h14v-2H5v2zM12 10h3l-4 4-4-4h3V3h2v7z"
                fill="currentColor"
              />
            </svg>
            <span class="quick-action-text">Downloads</span>
          </button>
          <button class="quick-action-button" id="developer-button">
            <svg
              class="quick-action-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"
                fill="currentColor"
              />
            </svg>
            <span class="quick-action-text">Developer</span>
          </button>
        </div>
      </div>
    </div>
    <script src="chrome://browser/content/smartwindow/marked.js"></script>
    <script
      type="module"
      src="chrome://browser/content/smartwindow/chat.mjs"
    ></script>
    <script
      type="module"
      src="chrome://browser/content/smartwindow/tool-log.mjs"
    ></script>
    <script
      type="module"
      src="chrome://browser/content/smartwindow/smartwindow.mjs"
    ></script>
  </body>
</html>
